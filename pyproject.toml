[project]
name = "eeg-fm-masking"
version = "0.1.0"
description = "What masking geometry works best for EEG foundation models? A controlled evaluation across MAE and JEPA."
authors = [{ name = "Pierre Guetschel" }]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "einops>=0.8.2,<1.0.0",
    "exca==0.5.23",
    "lightning>=2.5.2,<3.0.0",
    "mne>=1.10,<2.0",
    "numpy>=2.0,<3.0",
    "open-eeg-bench==0.5.0",
    "pandas>=2.0,<3.0",
    "pydantic>=2,<3",
    "submitit>=1.5,<2.0",
    "torch>=2.8.0,<2.9.0",
    "torchaudio>=2.8.0,<2.9.0",
    "wandb>=0.17,<1.0",
    "braindecode>=1.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.5,<9.0.0"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eeg_fm_masking"]
